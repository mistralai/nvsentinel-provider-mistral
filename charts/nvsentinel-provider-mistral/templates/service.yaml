apiVersion: v1
kind: Service
metadata:
  name: {{ include "provider.name" . }}
  labels:
    {{- include "provider.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "provider.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
