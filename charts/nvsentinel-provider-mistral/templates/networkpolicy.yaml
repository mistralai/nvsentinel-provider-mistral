{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "provider.name" . }}
  labels:
    {{- include "provider.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "provider.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ index (splitList ":" .Values.auth.serviceAccount) 2 | quote }}
          podSelector:
            {{- toYaml .Values.networkPolicy.callerPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 50051
{{- end }}
